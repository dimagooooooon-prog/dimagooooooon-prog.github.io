<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Survival Atlas</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c1511;color:#f5f5ed;font:16px system-ui,sans-serif;text-align:center}main{padding:28px}h1{font-size:28px;color:#eaa350}p{color:#b4c1b3}button{background:#eaa350;color:#142019;border:0;border-radius:12px;padding:12px 18px;font-size:16px}</style></head>
<body><main><h1>Survival Atlas</h1><p id="loading">Завантаження довідника…</p></main>
<script>
(async function(){
  const n=19;
  let loaded=0;
  const files=Array.from({length:n},(_,i)=>'./parts/'+String(i).padStart(3,'0')+'.txt');
  const parts=await Promise.all(files.map(async (f)=>{
     const r=await fetch(f);
     if(!r.ok)throw new Error(f+' HTTP '+r.status);
     const t=await r.text();
     loaded++;
     document.getElementById('loading').textContent='Завантажено '+loaded+' із '+n+' частин…';
     return t;
  }));
  const full=parts.join('');
  if(!full.trim().startsWith('<!doctype html>')||!full.trim().endsWith('</html>'))throw new Error('Неповний HTML');
  document.open();document.write(full);document.close();
})().catch(e=>{
  document.getElementById('loading').textContent='Помилка завантаження: '+e.message;
});
</script></body></html>
